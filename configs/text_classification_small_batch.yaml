task: text_classification
num_classes: 2
seq_len: 4096
vocab_size: 256

# model - same for all variants so comparison is fair even with reduced architecture
# reduced model dimensions for text classification due to GPU memory constraints at seq_len=4096
d_model: 256
num_heads: 4
num_layers: 4
d_ff: 1024
dropout: 0.1

# training
batch_size: 1 # reduced from 32 due to memory requirements at seq_len=4096
learning_rate: 0.001
epochs: 20
warmup_steps: 1000
seed: 42

# variant-specific settings
longformer_window_size: 512
linformer_proj_dim: 256
reformer_n_rounds: 4
reformer_chunk_size: 64
reformer_n_buckets: 64